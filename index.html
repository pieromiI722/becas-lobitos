<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consultá el resultado de tu examen de Becas Lobitos." />
    <title>Resultados — Becas Lobitos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 min-h-svh font-[Inter,system-ui,sans-serif] antialiased">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-lg mx-auto px-4 py-4 flex items-center gap-3">
        <!-- Logo/ícono institucional -->
        <div class="w-9 h-9 rounded-lg bg-sky-600 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 3.741-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5"/>
          </svg>
        </div>
        <div>
          <p class="text-xs font-medium text-slate-400 leading-none mb-0.5">Programa de</p>
          <h1 class="text-base font-bold text-slate-800 leading-none">Becas Lobitos</h1>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-lg mx-auto px-4 py-8 space-y-6">

      <!-- HERO TEXT -->
      <div class="text-center space-y-1">
        <h2 class="text-2xl font-bold text-slate-800">Resultados del examen</h2>
        <p class="text-slate-500 text-sm">Ingresá tu código de postulante o DNI para ver tu resultado.</p>
      </div>

      <!-- CARD BÚSQUEDA -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <form id="search-form" novalidate>
          <label for="search-input" class="block text-sm font-medium text-slate-700 mb-2">
            Código de postulante / DNI
          </label>

          <div id="input-wrap" class="mb-4">
            <div class="flex gap-2">
              <input
                id="search-input"
                type="text"
                inputmode="text"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                placeholder="Ej: 12345678 o BEC-001"
                class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 placeholder-slate-400
                       text-base focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400
                       disabled:opacity-50 disabled:cursor-not-allowed transition"
              />
              <button
                id="search-btn"
                type="submit"
                class="flex items-center justify-center w-11 h-11 rounded-xl bg-sky-600 text-white
                       hover:bg-sky-700 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed
                       transition-all flex-shrink-0"
                aria-label="Buscar"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
                </svg>
              </button>
            </div>
          </div>

          <p class="text-xs text-slate-400">
            Los resultados son personales y confidenciales. Solo vos podés ver tu resultado ingresando tu código.
          </p>
        </form>
      </div>

      <!-- ZONA DE RESULTADOS (se llena dinámicamente) -->
      <div id="result"></div>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-8 text-xs text-slate-400">
      Becas Lobitos &mdash; Consultas al área de becas
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
